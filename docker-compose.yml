services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_USER: controle
      POSTGRES_PASSWORD: ${DB_PASSWORD:-controle}
      POSTGRES_DB: controle
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controle"]
      interval: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql+psycopg://controle:${DB_PASSWORD:-controle}@db/controle
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
    ports:
      - "6000:8000"
    volumes:
      - ./app:/app/app      # edição de código reflete ao reiniciar
      - uploads:/app/uploads
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 30s
      retries: 3

  # backup diário (30 dias) + botão "backup agora" (arquivo-sinal /backups/.agora)
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      TZ: America/Sao_Paulo
      PGPASSWORD: ${DB_PASSWORD:-controle}
    volumes:
      - ./backups:/backups
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          if [ -f /backups/.agora ] || [ ! -f /backups/.ultimo ] || [ -n "$$(find /backups/.ultimo -mmin +1440)" ]; then
            rm -f /backups/.agora
            f=/backups/controle-$$(date +%F-%H%M).sql
            if pg_dump -h db -U controle controle > $$f && gzip -f $$f; then touch /backups/.ultimo; else rm -f $$f; sleep 60; fi
            find /backups -name 'controle-*.sql.gz' -mtime +30 -delete
          fi
          sleep 10
        done

  # IA local opcional: docker compose --profile ia up -d  &&  docker compose exec ollama ollama pull qwen2.5:1.5b
  ollama:
    image: ollama/ollama
    profiles: ["ia"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  uploads:
  ollama:
