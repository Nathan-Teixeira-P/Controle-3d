services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_USER: controle
      POSTGRES_PASSWORD: ${DB_PASSWORD:-controle}
      POSTGRES_DB: controle
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controle"]
      interval: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql+psycopg://controle:${DB_PASSWORD:-controle}@db/controle
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
    ports:
      - "3000:8000"
    volumes:
      - ./app:/app/app      # edição de código reflete ao reiniciar
      - uploads:/app/uploads
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 30s
      retries: 3

  # Backup a cada 6 h (banco: 30 dias; arquivos enviados: 3 últimos) + botão "backup agora".
  # Se o banco subir vazio e houver backup com dados em ./backups, restaura sozinho (ver backup.sh).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      TZ: America/Sao_Paulo
      PGPASSWORD: ${DB_PASSWORD:-controle}
    volumes:
      - ./backups:/backups
      - ./backup.sh:/backup.sh:ro
      - uploads:/uploads
    entrypoint: ["sh", "/backup.sh"]

  # IA local opcional: docker compose --profile ia up -d  &&  docker compose exec ollama ollama pull qwen2.5:1.5b
  ollama:
    image: ollama/ollama
    profiles: ["ia"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

# Volumes "external": `docker compose down -v` NÃO os apaga. Crie uma vez com iniciar.bat / iniciar.sh.
volumes:
  pgdata: {external: true, name: controle_pgdata}
  uploads: {external: true, name: controle_uploads}
  ollama:
