<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar</title><link rel="icon" href="/static/logo.png">
<link rel="stylesheet" href="/static/tema.css"><script>try{var t=localStorage.getItem('tema')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.tema=t}catch(e){}</script><style>body{font:15px system-ui;background:var(--bg);color:var(--text);display:grid;place-items:center;min-height:100vh;margin:0}form{background:var(--card);padding:28px;border-radius:10px;width:min(340px,92vw);box-shadow:0 2px 8px var(--shadow)}
img{width:100%}.logo-escuro{display:none}:root[data-tema=dark] .logo-claro{display:none}:root[data-tema=dark] .logo-escuro{display:block}input{width:100%;padding:9px;margin:6px 0 12px;border:1px solid var(--border);border-radius:6px;font:inherit;background:var(--input);color:var(--text)}button{width:100%;background:var(--btn);color:#fff;border:0;padding:10px;border-radius:6px;font:inherit;cursor:pointer}.e{color:var(--bad)}</style></head>
<body><form method="post" action="{{ '/setup' if setup else '/login' }}"><img class="logo-claro" src="/static/logo.png"><img class="logo-escuro" src="/static/logo-noturno.png">
<h3>{{ 'Primeiro acesso: crie o usuário' if setup else 'Entrar' }}</h3>{% if erro %}<p class="e">{{erro}}</p>{% endif %}
<label>Usuário</label><input name="nome" required autofocus><label>Senha</label><input name="senha" type="password" required>
<button>{{ 'Criar e entrar' if setup else 'Entrar' }}</button></form></body></html>
